<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" style="background: transparent;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="10" y="10" width="1180" height="340" rx="20" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" filter="url(#drop-shadow)" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="1020" cy="110" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="270" r="160" fill="#0ea5e9" opacity="0.10" filter="url(#glow)" />
  <circle cx="700" cy="40" r="90" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 60,10 L 60,350 M 160,10 L 160,350 M 260,10 L 260,350 M 360,10 L 360,350 M 460,10 L 460,350 M 560,10 L 560,350 M 660,10 L 660,350 M 760,10 L 760,350 M 860,10 L 860,350 M 960,10 L 960,350 M 1060,10 L 1060,350" />
    <path d="M 10,60 L 1190,60 M 10,120 L 1190,120 M 10,180 L 1190,180 M 10,240 L 1190,240 M 10,300 L 1190,300" />
  </g>

  <!-- Left: Stylized Book & Agent Transformation Icon -->
  <g transform="translate(65, 75)">
    <!-- Book Spine & Pages (Backdrop) -->
    <path d="M 40,30 C 70,18 100,18 130,30 L 130,170 C 100,158 70,158 40,170 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <path d="M 130,30 C 160,18 190,18 220,30 L 220,170 C 190,158 160,158 130,170 Z" fill="#334155" stroke="#64748b" stroke-width="2" />
    
    <!-- Open Book Dynamic Glow -->
    <path d="M 45,35 C 72,25 98,25 125,35 L 125,165 C 98,155 72,155 45,165 Z" fill="#0f172a" opacity="0.8" />
    <path d="M 135,35 C 162,25 188,25 215,35 L 215,165 C 188,155 162,155 135,165 Z" fill="#1e293b" opacity="0.9" />

    <!-- Agent Neural Network Nodes over Book -->
    <!-- Connection lines -->
    <line x1="85" y1="75" x2="130" y2="45" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" stroke-dasharray="3 3" />
    <line x1="85" y1="75" x2="130" y2="105" stroke="#818cf8" stroke-width="2.5" opacity="0.8" />
    <line x1="130" y1="45" x2="175" y2="75" stroke="#a855f7" stroke-width="2.5" opacity="0.8" stroke-dasharray="3 3" />
    <line x1="130" y1="105" x2="175" y2="75" stroke="#c084fc" stroke-width="2.5" opacity="0.8" />
    <line x1="85" y1="130" x2="130" y2="105" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
    <line x1="130" y1="105" x2="175" y2="135" stroke="#34d399" stroke-width="2.5" opacity="0.8" />

    <!-- Nodes with glowing borders -->
    <circle cx="85" cy="75" r="9" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="2.5" />
    <circle cx="85" cy="130" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    
    <circle cx="130" cy="45" r="11" fill="#6366f1" stroke="#e0e7ff" stroke-width="3" />
    <circle cx="130" cy="105" r="14" fill="#8b5cf6" stroke="#f3e8ff" stroke-width="3" />
    
    <circle cx="175" cy="75" r="10" fill="#a855f7" stroke="#fae8ff" stroke-width="2.5" />
    <circle cx="175" cy="135" r="9" fill="#10b981" stroke="#d1fae5" stroke-width="2.5" />

    <!-- Inner Core Sparkle -->
    <circle cx="130" cy="105" r="5" fill="#ffffff" />
  </g>

  <!-- Typography & Badges Area -->
  <g transform="translate(320, 68)">
    <!-- Pre-Title Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="18" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">AUTONOMOUS TRANSLATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="76" fill="url(#primary-glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="850" letter-spacing="-0.5">BleBelTranslateBook</text>

    <!-- Subtitle / Value Proposition -->
    <text x="2" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
      Production-Grade Multi-Agent Book Localization Pipeline · EPUB to EPUB
    </text>

    <text x="2" y="136" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Verifiable LangGraph Agents · Entity-Locked Consistency · Granular LLM Cost Routing
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: Markdown Lifecycle -->
      <g transform="translate(0, 0)">
        <rect width="185" height="36" rx="10" fill="url(#badge-glow)" stroke="#475569" stroke-width="1.2" />
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ EPUB ➔ MD ➔ EPUB</text>
      </g>

      <!-- Badge 2: Locked Glossary -->
      <g transform="translate(197, 0)">
        <rect width="185" height="36" rx="10" fill="url(#badge-glow)" stroke="#475569" stroke-width="1.2" />
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔒 Entity-Locked Glossary</text>
      </g>

      <!-- Badge 3: Multi-Provider -->
      <g transform="translate(394, 0)">
        <rect width="185" height="36" rx="10" fill="url(#badge-glow)" stroke="#475569" stroke-width="1.2" />
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 Multi-LLM Cost Tuning</text>
      </g>

      <!-- Badge 4: Pause & Resume -->
      <g transform="translate(591, 0)">
        <rect width="190" height="36" rx="10" fill="url(#badge-glow)" stroke="#475569" stroke-width="1.2" />
        <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⏯️ Resumable &amp; Audited</text>
      </g>
    </g>

    <!-- Terminal Prompt Hint -->
    <g transform="translate(0, 222)">
      <rect width="460" height="32" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="21" fill="#10b981" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="13" font-weight="600">$</text>
      <text x="32" y="21" fill="#f8fafc" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12.5">book-translator wizard</text>
      <text x="215" y="21" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="12"># Guided interactive TUI</text>
    </g>
  </g>
</svg>
