name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: ruff, mypy, pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-book-splitter.txt
            requirements-dev.txt

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-book-splitter.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check book_splitter tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      # The snapshot tests already assert this, but making the environment
      # explicit documents what CI pins and gives a clear failure if a future
      # change starts depending on the hash seed.
      - name: Pytest with a different hash seed
        env:
          PYTHONHASHSEED: "1"
        run: pytest tests/test_snapshots.py tests/test_pipeline_fixture.py
