name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: ruff, mypy, pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project with its development extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check book_translator tests scripts

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      # The snapshot tests already assert this, but making the environment
      # explicit documents what CI pins and gives a clear failure if a future
      # change starts depending on the hash seed.
      - name: Pytest with a different hash seed
        env:
          PYTHONHASHSEED: "1"
        run: pytest tests/test_snapshots.py tests/test_pipeline_fixture.py

  package:
    name: build wheel and smoke-test the installed package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the wheel contents and metadata
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(
              name.endswith("book_translator/epub/assets/style.css") for name in names
          ), "the EPUB stylesheet is missing from the wheel"
          metadata = next(name for name in names if name.endswith(".dist-info/METADATA"))
          text = zipfile.ZipFile(wheel).read(metadata).decode("utf-8")
          for extra in ("convert", "dictionary", "chunk", "epub", "dev"):
              assert f"Provides-Extra: {extra}" in text, extra
          for script in ("book-translator", "book-translator-pipeline"):
              entry_points = next(
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              assert script in zipfile.ZipFile(wheel).read(entry_points).decode("utf-8")
          PY

      - name: Install the wheel and run the entry points
        run: |
          python -m pip install --force-reinstall dist/*.whl
          book-translator --help
          book-translator-pipeline --help
          python -m book_translator --help
          python -c "import book_translator; print(book_translator.__version__)"
