# Every model the pipeline talks to, in one file.
#
#   [llm]            shared defaults for every stage
#   [llm.<stage>]    that stage's overrides, for the stages that use a model:
#                    split, preprocess, dictionary, matter, translate, postprocess
#
# DeepSeek's `deepseek-flash` (V4.1 Flash) is the default everywhere: it is the
# [llm] default and is set explicitly in every stage below, so no stage silently
# picks another model. Replace one stage's model with `deepseek-v4-pro` when that
# stage deserves the stronger (and more expensive) model. The old deepseek-chat /
# deepseek-reasoner ids were retired in July 2026 and are not accepted.
#
# `model` / `base_url` never cross a provider boundary: [llm] values and a
# stage's own model are used only for the provider they were written for, so
# switching translation to a local LM Studio server never inherits the cloud
# model id. Temperature, timeout and max_retries are generic and always apply.
# Every field below is optional.
#
# Precedence for one stage and one field, highest first:
#   1. --llm <stage>.<field>=VALUE on the command line (repeatable)
#   2. the stage's own flags (--translate-model, or --model on a single command)
#   3. stage-specific environment (SPLITTER_<STAGE>_*, TRANSLATION_*, LMSTUDIO_*)
#   4. the shared pipeline flags (--provider, --model, --base-url, --api-key)
#   5. [llm.<stage>] below
#   6. [llm] below (when the provider matches)
#   7. the legacy SPLITTER_* environment variables
#   8. the provider's built-in default (deepseek-flash for DeepSeek)
#
# Keys are never written here: put DEEPSEEK_API_KEY / OPENAI_API_KEY /
# OPENROUTER_API_KEY / LM_STUDIO_API_KEY / OLLAMA_API_KEY in .env. A stage may
# name another variable with api_key_env = "MY_KEY".
#
# Examples:
#   python scripts/run_pipeline.py BOOK.md \
#       --llm translate.provider=lmstudio --llm translate.model=my-model
#   BOOK_SPLITTER_CONFIG=/tmp/cheap.toml python scripts/run_pipeline.py BOOK.md

[llm]
provider = "deepseek"
model = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
temperature = 0.0
timeout = 180.0
max_retries = 3

# Stage 1 — the routing agent. It reads the opening lines and routes; it never
# writes prose.
[llm.split]
model = "deepseek-flash"

# Stage 2 — the per-chapter cleaning agent (one run per chapter).
[llm.preprocess]
model = "deepseek-flash"

# Stages 3–4 — the glossary extractor (one call per chapter, the paid pass).
# The `glossary` command's stage; [llm.glossary] is accepted as an alias.
[llm.dictionary]
model = "deepseek-flash"

# Stage 6b — the front/back matter localizer (no dictionary, web title search).
[llm.matter]
model = "deepseek-flash"

# Stage 7 — the chunk translator, one call per chunk. The two backends are
# deepseek and a local LM Studio server; model may be omitted for LM Studio
# (the loaded id is read from GET /v1/models, an "en2sr" id winning).
[llm.translate]
model = "deepseek-flash"
# The local alternative:
# provider = "lmstudio"
# base_url = "http://127.0.0.1:1234/v1"
# model = "gemma-4-31b-en2sr-v3@q4_k_m"
# api_key_env = "MY_TRANSLATION_KEY"   # optional: read the key from another .env variable

# Stage 9 — the headings/table-of-contents agent (one call per chapter).
[llm.postprocess]
model = "deepseek-flash"
